<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absensi - Pegawai</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/adminlte@4/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 700px;">
    <h3 class="fw-bold">Rekap & Isi Absen</h3>

    <!-- Login -->
    <div class="card shadow mb-4" id="cardLogin">
      <div class="card-header bg-primary text-white"><h5 class="mb-0">Login Pegawai</h5></div>
      <div class="card-body">
        <form id="formLogin" onsubmit="return false;">
          <input type="text" class="form-control mb-3" id="username" placeholder="Username" autocomplete="username">
          <input type="password" class="form-control mb-3" id="password" placeholder="Password" autocomplete="current-password">
          <div id="loginErr" class="text-danger mb-3"></div>
          <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>
      </div>
    </div>

    <!-- Rekap absen pegawai -->
    <div class="card shadow" id="cardRekap" style="display: none;">
      <div class="card-header bg-primary text-white"><h5 class="mb-0">Rekap Absen</h5></div>
      <div class="card-body">
        <form class="row g-2 mb-3" id="formFilter" onsubmit="return false;">
          <div class="col-md-3"><input type="month" class="form-control" id="bulanIn"></div>
          <div class="col-auto"><button type="submit" class="btn btn-primary">Muat</button></div>
        </form>
        <form class="row g-2 align-items-end" id="formAbsen" onsubmit="return false;">
          <div class="col-md-3"><input type="date" class="form-control" id="tanggal"></div>
          <div class="col-md-2">
            <select class="form-select" id="statusAbsen"><option>hadir</option><option>izin</option><option>alpa</option><option>terlambat</option></select>
          </div>
          <div class="col-md-3"><input type="text" class="form-control" id="keterangan" placeholder="Keterangan"></div>
          <div class="col-auto"><button type="submit" class="btn btn-primary">Simpan Absen</button></div>
        </form>
        <div class="table-responsive mt-3">
          <table class="table table-sm table-hover" id="tabelAbsen">
            <thead><tr><th>Tanggal</th><th>Jam Masuk</th><th>Jam Pulang</th><th>Status</th><th>Terlambat</th><th>Keterangan</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    async function api(url, opts = {}) {
      const res = await fetch(url, Object.assign({ headers: { 'Content-Type': 'application/x-www-form-urlencoded' } }, opts));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error((data.error || data.message || 'Gagal ' + res.status));
      return data;
    }
    function flash(msg) { const el = document.getElementById('loginErr'); el.textContent = msg; }

    document.getElementById('formLogin').addEventListener('submit', async () => {
      try {
        const res = await api('/login', { method: 'POST', body: new URLSearchParams({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }) });
        document.getElementById('cardLogin').style.display = 'none';
        document.getElementById('cardRekap').style.display = '';
        document.getElementById('bulanIn').value = new Date().toISOString().slice(0, 7);
        loadRekap();
      } catch (e) { flash(e.message); }
    });
    document.getElementById('formFilter').addEventListener('submit', () => loadRekap());

    async function loadRekap() {
      const q = new URLSearchParams({ bulan: document.getElementById('bulanIn').value });
      const data = await api('/api/rekap-pegawai?' + q.toString());
      const tbody = document.querySelector('#tabelAbsen tbody');
      tbody.innerHTML = data.map(r => `<tr><td>${r.tanggal}</td><td>${r.jam_masuk || '-'}</td><td>${r.jam_pulang || '-'}</td><td>${r.status}</td><td>${r.menit_terlambat || 0}</td><td>${r.keterangan || ''}</td></tr>`).join('');
      // jam masuk default hari ini
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById('tanggal').value = today;
    }

    document.getElementById('formAbsen').addEventListener('submit', async () => {
      try {
        await api('/api/absen', { method: 'POST', body: new URLSearchParams({
          tanggal: document.getElementById('tanggal').value,
          status: document.getElementById('statusAbsen').value,
          jam_masuk: document.getElementById('tanggal').value + ' 09:00:00',
          keterangan: document.getElementById('keterangan').value,
        }) });
        loadRekap();
      } catch (e) { flash(e.message); }
    });
  </script>
</body>
</html>
