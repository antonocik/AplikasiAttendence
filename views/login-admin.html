<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absensi - Login Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/adminlte@4/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow col-md-4">
    <div class="card-header bg-primary text-white"><h5 class="mb-0">Login Admin</h5></div>
    <div class="card-body">
      <form id="formLoginAdmin" onsubmit="return false;">
        <input type="text" class="form-control mb-3" id="username" placeholder="Username" autocomplete="username">
        <input type="password" class="form-control mb-3" id="password" placeholder="Password" autocomplete="current-password">
        <div id="loginErr" class="text-danger mb-3"></div>
        <button class="btn btn-primary w-100" type="submit">Login</button>
      </form>
      <p class="text-center mt-3"><a href="/login-pegawai">Login sebagai pegawai?</a></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('formLoginAdmin').addEventListener('submit', async () => {
      const res = await fetch('/login-admin', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }) });
      const data = await res.json().catch(() => ({}));
      if (res.ok) { window.location = '/admin'; }
      else document.getElementById('loginErr').textContent = data.error || 'Login gagal';
    });
  </script>
</body>
</html>
